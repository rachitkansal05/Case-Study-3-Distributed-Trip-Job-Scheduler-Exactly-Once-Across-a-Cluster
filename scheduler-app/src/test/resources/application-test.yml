# Test profile. AbstractEmbeddedPostgresIT registers test.db.default-url (the shared database);
# a subclass that needs its own database registers test.db.url, which takes precedence here.
spring:
  datasource:
    url: ${test.db.url:${test.db.default-url}}
scheduler:
  node-id: test-node
  engine:
    # Spring-context ITs (API team) must not race the engine loops. Engine ITs build their
    # SchedulerNode instances explicitly, or enable the engine with a property override.
    enabled: false
