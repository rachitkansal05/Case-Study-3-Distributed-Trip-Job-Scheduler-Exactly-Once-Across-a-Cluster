spring:
  application:
    name: notification-sink
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/scheduler}
    username: ${SPRING_DATASOURCE_USERNAME:scheduler}
    password: ${SPRING_DATASOURCE_PASSWORD:scheduler}
  flyway:
    enabled: true
    # The sink owns only the `sink` schema; its Flyway history lives there too.
    schemas: sink
    default-schema: sink
    create-schemas: true
    locations: classpath:db/migration

sink:
  admin:
    # Required as X-Admin-Token on /admin/**. Dev default only: set SINK_ADMIN_TOKEN outside dev.
    token: ${SINK_ADMIN_TOKEN:dev-only-sink-admin-token}

server:
  port: ${SERVER_PORT:8090}
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
