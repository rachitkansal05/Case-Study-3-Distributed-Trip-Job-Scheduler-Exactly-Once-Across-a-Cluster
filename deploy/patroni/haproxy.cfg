# HAProxy in front of the Patroni cluster.
#   :5000  read-write  -> the member whose Patroni REST API answers 200 on /primary (holds the leader lock)
#   :5001  read-only   -> members answering 200 on /replica (running replicas, not tagged noloadbalance)
#   :7000  stats page
# Health checks hit Patroni (port 8008), never Postgres itself: Postgres on a demoted or isolated
# old primary may still accept connections, but its Patroni stops answering 200 on /primary as soon
# as it loses the leader lock. `on-marked-down shutdown-sessions` then cuts every open session to
# it, so no client keeps writing to an old primary through HAProxy (F4).

global
    maxconn 2000

defaults
    mode tcp
    log global
    retries 2
    timeout connect 4s
    timeout client 30m
    timeout server 30m
    timeout check 3s

# Docker's embedded DNS, so HAProxy starts even if a pg-N container is not up yet.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen primary
    bind *:5000
    option httpchk
    http-check send meth GET uri /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-1 pg-1:5432 maxconn 200 check port 8008
    server pg-2 pg-2:5432 maxconn 200 check port 8008
    server pg-3 pg-3:5432 maxconn 200 check port 8008

listen replicas
    bind *:5001
    balance roundrobin
    option httpchk
    http-check send meth GET uri /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions resolvers docker init-addr last,libc,none
    server pg-1 pg-1:5432 maxconn 200 check port 8008
    server pg-2 pg-2:5432 maxconn 200 check port 8008
    server pg-3 pg-3:5432 maxconn 200 check port 8008
