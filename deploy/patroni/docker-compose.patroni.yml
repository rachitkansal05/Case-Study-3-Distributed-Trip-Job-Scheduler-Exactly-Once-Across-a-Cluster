# Production-shaped PostgreSQL for the scheduler: 3 etcd + 3 Patroni/PostgreSQL 16 + HAProxy.
# docs/design/architecture.md section 12 "Failover requirements (production)" F1-F5; see deploy/patroni/README.md.
#
#   docker compose -f deploy/patroni/docker-compose.patroni.yml up -d --build
#
#   etcd-1..3   2379        DCS (leader lock, /sync key, dynamic config)
#   pg-1..3     8008        Patroni REST API (/primary, /replica, /health); Postgres on 5432 inside
#   haproxy     5000        read-write (current primary)
#               5001        read-only (replicas)
#               7000        HAProxy stats
#
# One host runs everything here, which is fine to try the config but is NOT production: a real
# deployment puts each pg-N (and each etcd-N) on its own machine, so one failure takes out one member.
# All passwords below are dev placeholders: override them (e.g. an .env file) anywhere else.

x-etcd: &etcd
  image: quay.io/coreos/etcd:v3.5.15
  restart: unless-stopped
  environment: &etcd-env
    ETCD_DATA_DIR: /etcd-data
    ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
    ETCD_INITIAL_CLUSTER: etcd-1=http://etcd-1:2380,etcd-2=http://etcd-2:2380,etcd-3=http://etcd-3:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: scheduler-pg-etcd

x-patroni: &patroni
  build:
    context: .
    dockerfile: Dockerfile
  image: trip-scheduler/patroni-pg16:dev
  restart: unless-stopped
  depends_on:
    - etcd-1
    - etcd-2
    - etcd-3
  volumes:
    - ./patroni.yml:/etc/patroni/patroni.yml:ro
  # Watchdog (F4). The host must load softdog first:  sudo modprobe softdog
  # and let uid 999 (postgres in the image) open it, e.g.  sudo chown 999 /dev/watchdog
  # Only one process can hold /dev/watchdog, and only the leader opens it. With all three members
  # on one host, a hung old leader would keep it open and block the new leader under
  # `mode: required`. For a single-host demo set WATCHDOG_MODE=automatic (README.md).
  devices:
    - /dev/watchdog:/dev/watchdog
  environment: &patroni-env
    WATCHDOG_MODE: ${WATCHDOG_MODE:-}
    PATRONI_SUPERUSER_PASSWORD: ${PATRONI_SUPERUSER_PASSWORD:-dev-superuser}
    PATRONI_REPLICATION_PASSWORD: ${PATRONI_REPLICATION_PASSWORD:-dev-replicator}
    PATRONI_REWIND_PASSWORD: ${PATRONI_REWIND_PASSWORD:-dev-rewinder}
    SCHEDULER_DB_PASSWORD: ${SCHEDULER_DB_PASSWORD:-scheduler}
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8008/liveness || exit 1"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  etcd-1:
    <<: *etcd
    container_name: etcd-1
    hostname: etcd-1
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-1
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-1:2380
    volumes:
      - etcd1:/etcd-data

  etcd-2:
    <<: *etcd
    container_name: etcd-2
    hostname: etcd-2
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-2
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-2:2380
    volumes:
      - etcd2:/etcd-data

  etcd-3:
    <<: *etcd
    container_name: etcd-3
    hostname: etcd-3
    environment:
      <<: *etcd-env
      ETCD_NAME: etcd-3
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd-3:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://etcd-3:2380
    volumes:
      - etcd3:/etcd-data

  pg-1:
    <<: *patroni
    container_name: pg-1
    hostname: pg-1
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-1
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-1:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-1:5432
    volumes:
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
      - pg1:/var/lib/postgresql/data
    ports:
      - "8008:8008"

  pg-2:
    <<: *patroni
    container_name: pg-2
    hostname: pg-2
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-2
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-2:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-2:5432
    volumes:
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
      - pg2:/var/lib/postgresql/data
    ports:
      - "8009:8008"

  pg-3:
    <<: *patroni
    container_name: pg-3
    hostname: pg-3
    environment:
      <<: *patroni-env
      PATRONI_NAME: pg-3
      PATRONI_RESTAPI_CONNECT_ADDRESS: pg-3:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg-3:5432
    volumes:
      - ./patroni.yml:/etc/patroni/patroni.yml:ro
      - pg3:/var/lib/postgresql/data
    ports:
      - "8010:8008"

  haproxy:
    image: haproxy:2.9
    container_name: pg-haproxy
    restart: unless-stopped
    depends_on:
      - pg-1
      - pg-2
      - pg-3
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "5000:5000"
      - "5001:5001"
      - "7000:7000"

volumes:
  etcd1:
  etcd2:
  etcd3:
  pg1:
  pg2:
  pg3:

# Network: compose's default network. To run the scheduler stack against this cluster, attach both
# projects to one external network or run them in one project; see README.md.
