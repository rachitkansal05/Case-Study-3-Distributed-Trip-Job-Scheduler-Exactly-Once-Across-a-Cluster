global:
  scrape_interval: 5s
  evaluation_interval: 5s

# docs/design/architecture.md section 14 alert rules; mounted next to this file by docker-compose.yml.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: scheduler
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["scheduler-1:8080", "scheduler-2:8080", "scheduler-3:8080"]

  - job_name: notification-sink
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notification-sink:8090"]
